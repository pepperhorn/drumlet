name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run build:lib
      - run: npm run verify:lib
      - run: npm run smoke:pack

      - name: Install Chromium for embed checks
        run: |
          set -euo pipefail
          browser_dir="$RUNNER_TEMP/drumlet-browser"
          npm install --prefix "$browser_dir" --no-save --no-package-lock --ignore-scripts playwright-core@1.64.1
          modules="$browser_dir/node_modules"
          PLAYWRIGHT_BROWSERS_PATH="$browser_dir/browsers" \
            "$modules/.bin/playwright-core" install --with-deps --only-shell chromium
          shell=("$browser_dir"/browsers/chromium_headless_shell-*/chrome-headless-shell-linux64/chrome-headless-shell)
          test -x "${shell[0]}"
          # The package check uses PLAYWRIGHT_CORE_PATH. The iframe check resolves via NODE_PATH.
          printf '%s\n' "CHROMIUM_PATH=${shell[0]}" "PLAYWRIGHT_CORE_PATH=$modules/playwright-core" "NODE_PATH=$modules" >> "$GITHUB_ENV"

      - run: npm run check:embed
      - run: npm run check:embed-route
